<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative;
    background: #0C1524; color: #fff;
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 68px 76px;
  }
  .glow { position: absolute; border-radius: 50%; filter: blur(90px); }
  .g1 { width: 620px; height: 620px; right: -180px; top: -260px; background: radial-gradient(circle, rgba(31,90,246,.75), transparent 70%); }
  .g2 { width: 460px; height: 460px; left: -160px; bottom: -230px; background: radial-gradient(circle, rgba(14,165,183,.6), transparent 70%); }
  .g3 { width: 300px; height: 300px; left: 46%; top: 34%; background: radial-gradient(circle, rgba(255,122,24,.42), transparent 70%); }
  .grid {
    position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(ellipse 85% 65% at 50% 40%, #000 25%, transparent 80%);
    -webkit-mask-image: radial-gradient(ellipse 85% 65% at 50% 40%, #000 25%, transparent 80%);
  }
  .row { position: relative; z-index: 2; display: flex; align-items: center; gap: 16px; }
  .mark { width: 56px; height: 56px; border-radius: 16px; box-shadow: 0 10px 30px rgba(31,90,246,.5); }
  .brand { font-size: 27px; font-weight: 800; letter-spacing: -.02em; }
  .brand small { display: block; font-size: 15px; font-weight: 500; color: rgba(255,255,255,.62); letter-spacing: 0; margin-top: 2px; }
  h1 { position: relative; z-index: 2; font-size: 68px; line-height: 1.08; letter-spacing: -.035em; font-weight: 800; max-width: 940px; }
  h1 em { font-style: normal; background: linear-gradient(100deg, #4d84ff, #0EA5B7); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .foot { position: relative; z-index: 2; display: flex; align-items: center; justify-content: space-between; }
  .pills { display: flex; gap: 11px; }
  .pill { padding: 11px 21px; border-radius: 999px; font-size: 18px; font-weight: 700; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.17); }
  .phone { font-size: 25px; font-weight: 800; letter-spacing: -.01em; }
  .phone small { display: block; font-size: 14px; font-weight: 600; color: rgba(255,255,255,.58); letter-spacing: .1em; text-transform: uppercase; text-align: right; margin-bottom: 3px; }
</style>
</head>
<body>
  <div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div><div class="grid"></div>

  <div class="row">
    <svg class="mark" viewBox="0 0 32 32" width="56" height="56" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs><linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
        <stop stop-color="#1F5AF6"/><stop offset="1" stop-color="#0EA5B7"/></linearGradient></defs>
      <rect width="32" height="32" rx="9" fill="url(#bg)"/>
      <path d="M16 6.5 7.5 13v11.5A1.5 1.5 0 0 0 9 26h14a1.5 1.5 0 0 0 1.5-1.5V13L16 6.5Z" stroke="#fff" stroke-width="1.9" stroke-linejoin="round"/>
      <path d="M12.5 20.5c1.8-2.2 5.2-2.2 7 0" stroke="#fff" stroke-width="1.9" stroke-linecap="round"/>
    </svg>
    <div class="brand">Jalandhar Services<small>Painting · Cleaning · Waterproofing</small></div>
  </div>

  <h1>Painting, cleaning and <em>waterproofing</em> across Jalandhar</h1>

  <div class="foot">
    <div class="pills">
      <span class="pill">Free site visit</span>
      <span class="pill">Fixed written quotes</span>
      <span class="pill">Published rates</span>
    </div>
    <div class="phone"><small>Call or WhatsApp</small>+91 99147 72275</div>
  </div>
</body>
</html>
